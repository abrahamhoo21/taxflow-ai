<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="100%" height="100%" style="background:#0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="gradClient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="gradAPI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="gradDB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="gradAI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <!-- Filter for subtle drop shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    
    <!-- Marker for arrows -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#c084fc" />
    </marker>
  </defs>

  <!-- Title Header -->
  <g transform="translate(60, 40)">
    <text x="0" y="0" fill="#f8fafc" font-size="24" font-weight="700">YYC taxPOD CRM + Tax AI Assistant</text>
    <text x="0" y="24" fill="#94a3b8" font-size="14">System Component Architecture Diagram (3-Tier Cloud Architecture)</text>
    <rect x="940" y="-18" width="140" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="960" y="2" fill="#38bdf8" font-size="12" font-weight="600">Full-Stack TS</text>
  </g>

  <!-- ================= TIER 1: CLIENT PRESENTATION ================= -->
  <g transform="translate(60, 100)">
    <!-- Container Box -->
    <rect width="320" height="660" rx="16" fill="url(#gradClient)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="320" height="48" rx="16" fill="#1e293b" />
    <path d="M 0 32 L 0 48 L 320 48 L 320 32 Z" fill="#1e293b"/>
    <circle cx="24" cy="24" r="6" fill="#ef4444"/>
    <circle cx="42" cy="24" r="6" fill="#eab308"/>
    <circle cx="60" cy="24" r="6" fill="#22c55e"/>
    <text x="80" y="29" fill="#f8fafc" font-size="14" font-weight="700">Frontend Presentation Tier</text>
    <text x="24" y="70" fill="#38bdf8" font-size="12" font-weight="600">Next.js 14 App Router + Tailwind + shadcn/ui</text>

    <!-- Component 1: Dashboard -->
    <g transform="translate(20, 90)">
      <rect width="280" height="95" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="16" y="28" fill="#38bdf8" font-size="14" font-weight="700">📊 Dashboard Screen</text>
      <text x="16" y="50" fill="#cbd5e1" font-size="11">• Total Contacts (Leads/Customers)</text>
      <text x="16" y="68" fill="#cbd5e1" font-size="11">• Open Opportunities &amp; Pipeline Value (RM)</text>
      <text x="16" y="86" fill="#94a3b8" font-size="10">Component: <tspan fill="#38bdf8">page.tsx / DashboardKPI.tsx</tspan></text>
    </g>

    <!-- Component 2: Leads Management -->
    <g transform="translate(20, 200)">
      <rect width="280" height="95" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="16" y="28" fill="#34d399" font-size="14" font-weight="700">👤 Leads &amp; Contacts</text>
      <text x="16" y="50" fill="#cbd5e1" font-size="11">• Search &amp; Filter by Status (Lead/Prospect/Cust)</text>
      <text x="16" y="68" fill="#cbd5e1" font-size="11">• Create, Edit, Delete Modal Forms</text>
      <text x="16" y="86" fill="#94a3b8" font-size="10">Component: <tspan fill="#34d399">LeadsTable.tsx / LeadModal.tsx</tspan></text>
    </g>

    <!-- Component 3: Kanban Pipeline -->
    <g transform="translate(20, 310)">
      <rect width="280" height="105" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="16" y="28" fill="#fbbf24" font-size="14" font-weight="700">📋 Kanban Opportunity Board</text>
      <text x="16" y="50" fill="#cbd5e1" font-size="11">• Stages: New ➔ Contacted ➔ Qualified ➔</text>
      <text x="16" y="68" fill="#cbd5e1" font-size="11">  Proposal ➔ Won / Lost (Deal Value in RM)</text>
      <text x="16" y="86" fill="#cbd5e1" font-size="11">• Drag-and-Drop (@hello-pangea/dnd)</text>
      <text x="16" y="102" fill="#94a3b8" font-size="10">Component: <tspan fill="#fbbf24">KanbanBoard.tsx</tspan></text>
    </g>

    <!-- Component 4: Tax RAG Assistant -->
    <g transform="translate(20, 430)">
      <rect width="280" height="105" rx="10" fill="#1e293b" stroke="#c084fc" stroke-width="1.2"/>
      <text x="16" y="28" fill="#c084fc" font-size="14" font-weight="700">🤖 Tax RAG Assistant (Mandatory)</text>
      <text x="16" y="50" fill="#cbd5e1" font-size="11">• Malaysian Tax Q&amp;A Chat Drawer</text>
      <text x="16" y="68" fill="#cbd5e1" font-size="11">• Citations: [Doc Name, Page #, Section]</text>
      <text x="16" y="86" fill="#cbd5e1" font-size="11">• Hallucination Guardrail Message Badge</text>
      <text x="16" y="102" fill="#94a3b8" font-size="10">Component: <tspan fill="#c084fc">TaxChatDrawer.tsx</tspan></text>
    </g>

    <!-- Component 5: Meeting Notes Extractor (Option B) -->
    <g transform="translate(20, 550)">
      <rect width="280" height="95" rx="10" fill="#1e293b" stroke="#f472b6" stroke-width="1.2"/>
      <text x="16" y="28" fill="#f472b6" font-size="14" font-weight="700">📝 Meeting Notes (Option B)</text>
      <text x="16" y="50" fill="#cbd5e1" font-size="11">• Paste raw notes ➔ AI auto-extraction</text>
      <text x="16" y="68" fill="#cbd5e1" font-size="11">• Human-in-the-Loop Review &amp; Save Modal</text>
      <text x="16" y="86" fill="#94a3b8" font-size="10">Component: <tspan fill="#f472b6">NotesExtractorModal.tsx</tspan></text>
    </g>
  </g>

  <!-- ================= TIER 2: BACKEND & API TIER ================= -->
  <g transform="translate(430, 100)">
    <rect width="320" height="660" rx="16" fill="url(#gradAPI)" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="320" height="48" rx="16" fill="#064e3b" />
    <path d="M 0 32 L 0 48 L 320 48 L 320 32 Z" fill="#064e3b"/>
    <text x="24" y="29" fill="#f8fafc" font-size="14" font-weight="700">Backend &amp; API Service Tier</text>
    <text x="24" y="70" fill="#34d399" font-size="12" font-weight="600">Next.js Server Actions &amp; Route Handlers (TS)</text>

    <!-- Service 1: CRM API -->
    <g transform="translate(20, 95)">
      <rect width="280" height="120" rx="10" fill="#062e24" stroke="#059669" stroke-width="1"/>
      <text x="16" y="28" fill="#34d399" font-size="13" font-weight="700">🔌 CRM Controller Services</text>
      <text x="16" y="52" fill="#a7f3d0" font-size="11">/api/leads: CRUD on contact info</text>
      <text x="16" y="72" fill="#a7f3d0" font-size="11">/api/opportunities: Stage transitions &amp; RM</text>
      <text x="16" y="92" fill="#a7f3d0" font-size="11">/api/activities: Call/Email/Meeting audit log</text>
      <text x="16" y="110" fill="#6ee7b7" font-size="10">Data Validation: <tspan fill="#fff">Zod Schema Enforcement</tspan></text>
    </g>

    <!-- Service 2: RAG Pipeline Service -->
    <g transform="translate(20, 240)">
      <rect width="280" height="175" rx="10" fill="#062e24" stroke="#059669" stroke-width="1.2"/>
      <text x="16" y="28" fill="#38bdf8" font-size="13" font-weight="700">🔍 RAG Query &amp; Ingestion Engine</text>
      <text x="16" y="52" fill="#bae6fd" font-size="11">• PDF Parsing (pdf-parse)</text>
      <text x="16" y="72" fill="#bae6fd" font-size="11">• Recursive Chunking (~800 tokens, 150 ovl)</text>
      <text x="16" y="92" fill="#bae6fd" font-size="11">• Embedding Caller: text-embedding-004</text>
      <text x="16" y="112" fill="#bae6fd" font-size="11">• Vector Search: Top-K Cosine Similarity RPC</text>
      <text x="16" y="132" fill="#bae6fd" font-size="11">• Citation Assembler (Doc Name + Page #)</text>
      <text x="16" y="152" fill="#38bdf8" font-size="11">• Hallucination Guardrail Check</text>
      <text x="16" y="168" fill="#94a3b8" font-size="10">Endpoint: <tspan fill="#38bdf8">/api/rag/query &amp; /api/rag/ingest</tspan></text>
    </g>

    <!-- Service 3: Meeting Extractor Service -->
    <g transform="translate(20, 440)">
      <rect width="280" height="100" rx="10" fill="#062e24" stroke="#f472b6" stroke-width="1"/>
      <text x="16" y="28" fill="#f472b6" font-size="13" font-weight="700">🧩 Notes Extractor Service</text>
      <text x="16" y="52" fill="#fbcfe8" font-size="11">• Zero-shot extraction via Gemini Flash</text>
      <text x="16" y="72" fill="#fbcfe8" font-size="11">• Enforce JSON Schema (Zod parser)</text>
      <text x="16" y="92" fill="#94a3b8" font-size="10">Endpoint: <tspan fill="#f472b6">/api/ai/extract-notes</tspan></text>
    </g>

    <!-- Ingestion Batch CLI -->
    <g transform="translate(20, 560)">
      <rect width="280" height="85" rx="10" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="16" y="26" fill="#fbbf24" font-size="12" font-weight="700">📦 One-Click Ingestion CLI</text>
      <text x="16" y="46" fill="#cbd5e1" font-size="11">Command: <tspan font-family="monospace" fill="#fbbf24">npm run ingest</tspan></text>
      <text x="16" y="66" fill="#94a3b8" font-size="10">Auto-embeds 5 Tax PDFs into Supabase pgvector</text>
    </g>
  </g>

  <!-- ================= TIER 3: DATA & AI TIER ================= -->
  <g transform="translate(800, 100)">
    
    <!-- 3A: Supabase Database Box -->
    <g transform="translate(0, 0)">
      <rect width="340" height="315" rx="16" fill="url(#gradDB)" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
      <rect x="0" y="0" width="340" height="48" rx="16" fill="#78350f" />
      <path d="M 0 32 L 0 48 L 340 48 L 340 32 Z" fill="#78350f"/>
      <text x="24" y="29" fill="#f8fafc" font-size="14" font-weight="700">🐘 Supabase (PostgreSQL + pgvector)</text>
      <text x="24" y="70" fill="#fbbf24" font-size="12" font-weight="600">Unified Relational &amp; Vector Database</text>

      <g transform="translate(20, 90)">
        <rect width="300" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="12" y="26" fill="#f8fafc" font-size="12" font-weight="600">Table: <tspan fill="#34d399">leads</tspan> <tspan fill="#94a3b8" font-weight="normal">(id, name, email, phone, company, status)</tspan></text>
      </g>
      <g transform="translate(20, 140)">
        <rect width="300" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="12" y="26" fill="#f8fafc" font-size="12" font-weight="600">Table: <tspan fill="#fbbf24">opportunities</tspan> <tspan fill="#94a3b8" font-weight="normal">(id, lead_id, title, value_rm, stage)</tspan></text>
      </g>
      <g transform="translate(20, 190)">
        <rect width="300" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="12" y="26" fill="#f8fafc" font-size="12" font-weight="600">Table: <tspan fill="#38bdf8">activities</tspan> <tspan fill="#94a3b8" font-weight="normal">(id, lead_id, opp_id, type, description, date)</tspan></text>
      </g>
      <g transform="translate(20, 240)">
        <rect width="300" height="60" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1.2"/>
        <text x="12" y="24" fill="#c084fc" font-size="12" font-weight="700">Table: tax_document_chunks (pgvector)</text>
        <text x="12" y="44" fill="#cbd5e1" font-size="11">embedding: <tspan fill="#a855f7">vector(768)</tspan> with HNSW Cosine Index</text>
      </g>
    </g>

    <!-- 3B: External Google Gemini AI Box -->
    <g transform="translate(0, 345)">
      <rect width="340" height="315" rx="16" fill="url(#gradAI)" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow)"/>
      <rect x="0" y="0" width="340" height="48" rx="16" fill="#581c87" />
      <path d="M 0 32 L 0 48 L 340 48 L 340 32 Z" fill="#581c87"/>
      <text x="24" y="29" fill="#f8fafc" font-size="14" font-weight="700">🧠 Google Gemini AI Cloud Service</text>
      <text x="24" y="70" fill="#c084fc" font-size="12" font-weight="600">Official Google Generative AI API</text>

      <!-- Gemini Flash Model -->
      <g transform="translate(20, 90)">
        <rect width="300" height="95" rx="10" fill="#2e1065" stroke="#7e22ce" stroke-width="1"/>
        <text x="14" y="28" fill="#c084fc" font-size="13" font-weight="700">⚡ gemini-1.5-flash</text>
        <text x="14" y="50" fill="#e9d5ff" font-size="11">• Real-time RAG Context Synthesis</text>
        <text x="14" y="68" fill="#e9d5ff" font-size="11">• Strict citation tagging &amp; zero hallucination</text>
        <text x="14" y="86" fill="#e9d5ff" font-size="11">• Fast JSON structured extraction</text>
      </g>

      <!-- Embedding Model -->
      <g transform="translate(20, 200)">
        <rect width="300" height="95" rx="10" fill="#2e1065" stroke="#7e22ce" stroke-width="1"/>
        <text x="14" y="28" fill="#a855f7" font-size="13" font-weight="700">🔤 text-embedding-004</text>
        <text x="14" y="50" fill="#e9d5ff" font-size="11">• 768-dimensional dense semantic vectors</text>
        <text x="14" y="68" fill="#e9d5ff" font-size="11">• Document chunk embedding at ingestion</text>
        <text x="14" y="86" fill="#e9d5ff" font-size="11">• Query embedding at search runtime</text>
      </g>
    </g>

  </g>

  <!-- ================= ARROW CONNECTORS ================= -->
  <!-- Frontend to Backend -->
  <path d="M 380 200 L 430 200" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 380 370 L 430 370" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 380 500 L 430 390" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow-purple)" />
  <path d="M 380 610 L 430 500" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Backend to DB -->
  <path d="M 750 200 L 800 200" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)" />
  <path d="M 750 370 L 800 370" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)" />

  <!-- Backend to External AI -->
  <path d="M 750 340 L 775 340 L 775 480 L 800 480" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow-purple)" stroke-dasharray="4,4" />
  <path d="M 750 510 L 800 510" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow-purple)" stroke-dasharray="4,4" />

</svg>
