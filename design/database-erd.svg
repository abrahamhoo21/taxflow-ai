<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    
    <!-- Glow Filters -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="circleMarker" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
      <circle cx="5" cy="5" r="3" fill="#090d16" stroke="#3b82f6" stroke-width="2"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="12" height="32" rx="3" fill="url(#blueGrad)"/>
    <text x="24" y="24" font-size="24" font-weight="700" fill="#f8fafc" letter-spacing="-0.5">YYC taxPOD CRM &amp; Tax RAG Database Schema (ERD)</text>
    <text x="24" y="48" font-size="13" font-weight="400" fill="#94a3b8">PostgreSQL 15+ &amp; Supabase pgvector Architecture • Relational CRM &amp; Vector Embeddings</text>
  </g>

  <!-- ==================== TABLE 1: LEADS ==================== -->
  <g transform="translate(60, 130)" filter="url(#cardShadow)">
    <!-- Header -->
    <rect x="0" y="0" width="320" height="48" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="38" width="320" height="10" fill="#1e293b"/>
    <rect x="14" y="14" width="8" height="20" rx="2" fill="url(#blueGrad)"/>
    <text x="32" y="29" font-size="15" font-weight="700" fill="#f1f5f9">leads</text>
    <rect x="230" y="14" width="76" height="20" rx="4" fill="#3b82f6" fill-opacity="0.15"/>
    <text x="268" y="28" font-size="11" font-weight="600" fill="#60a5fa" text-anchor="middle">Contacts</text>

    <!-- Body -->
    <rect x="0" y="48" width="320" height="252" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="48" width="320" height="10" fill="#0f172a"/>

    <!-- Columns -->
    <!-- id -->
    <text x="16" y="76" font-size="12" font-family="monospace" font-weight="600" fill="#f8fafc">id</text>
    <text x="140" y="76" font-size="11" font-family="monospace" fill="#94a3b8">UUID</text>
    <rect x="256" y="63" width="48" height="18" rx="3" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="280" y="76" font-size="10" font-weight="700" fill="#fbbf24" text-anchor="middle">PK</text>
    <line x1="16" y1="89" x2="304" y2="89" stroke="#1e293b" stroke-width="1"/>

    <!-- name -->
    <text x="16" y="108" font-size="12" font-family="monospace" fill="#cbd5e1">name</text>
    <text x="140" y="108" font-size="11" font-family="monospace" fill="#64748b">VARCHAR(255)</text>
    <text x="290" y="108" font-size="11" fill="#ef4444" text-anchor="end">*</text>

    <!-- company -->
    <text x="16" y="136" font-size="12" font-family="monospace" fill="#cbd5e1">company</text>
    <text x="140" y="136" font-size="11" font-family="monospace" fill="#64748b">VARCHAR(255)</text>
    <text x="290" y="136" font-size="11" fill="#ef4444" text-anchor="end">*</text>

    <!-- email -->
    <text x="16" y="164" font-size="12" font-family="monospace" fill="#cbd5e1">email</text>
    <text x="140" y="164" font-size="11" font-family="monospace" fill="#64748b">VARCHAR(255)</text>
    <text x="290" y="164" font-size="11" fill="#ef4444" text-anchor="end">*</text>

    <!-- phone -->
    <text x="16" y="192" font-size="12" font-family="monospace" fill="#cbd5e1">phone</text>
    <text x="140" y="192" font-size="11" font-family="monospace" fill="#64748b">VARCHAR(50)</text>
    <text x="290" y="192" font-size="11" fill="#ef4444" text-anchor="end">*</text>

    <!-- status -->
    <text x="16" y="220" font-size="12" font-family="monospace" fill="#cbd5e1">status</text>
    <text x="140" y="220" font-size="11" font-family="monospace" fill="#64748b">VARCHAR(50)</text>
    <rect x="236" y="207" width="68" height="18" rx="3" fill="#10b981" fill-opacity="0.15"/>
    <text x="270" y="220" font-size="9" font-weight="600" fill="#34d399" text-anchor="middle">Lead|Pros|Cust</text>

    <!-- created_at -->
    <text x="16" y="248" font-size="12" font-family="monospace" fill="#94a3b8">created_at</text>
    <text x="140" y="248" font-size="11" font-family="monospace" fill="#64748b">TIMESTAMPTZ</text>

    <!-- updated_at -->
    <text x="16" y="276" font-size="12" font-family="monospace" fill="#94a3b8">updated_at</text>
    <text x="140" y="276" font-size="11" font-family="monospace" fill="#64748b">TIMESTAMPTZ</text>
  </g>

  <!-- ==================== TABLE 2: OPPORTUNITIES ==================== -->
  <g transform="translate(460, 130)" filter="url(#cardShadow)">
    <!-- Header -->
    <rect x="0" y="0" width="330" height="48" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="38" width="330" height="10" fill="#1e293b"/>
    <rect x="14" y="14" width="8" height="20" rx="2" fill="url(#amberGrad)"/>
    <text x="32" y="29" font-size="15" font-weight="700" fill="#f1f5f9">opportunities</text>
    <rect x="236" y="14" width="80" height="20" rx="4" fill="#f59e0b" fill-opacity="0.15"/>
    <text x="276" y="28" font-size="11" font-weight="600" fill="#fbbf24" text-anchor="middle">Pipeline Deals</text>

    <!-- Body -->
    <rect x="0" y="48" width="330" height="252" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="48" width="330" height="10" fill="#0f172a"/>

    <!-- Columns -->
    <!-- id -->
    <text x="16" y="76" font-size="12" font-family="monospace" font-weight="600" fill="#f8fafc">id</text>
    <text x="136" y="76" font-size="11" font-family="monospace" fill="#94a3b8">UUID</text>
    <rect x="266" y="63" width="48" height="18" rx="3" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="290" y="76" font-size="10" font-weight="700" fill="#fbbf24" text-anchor="middle">PK</text>
    <line x1="16" y1="89" x2="314" y2="89" stroke="#1e293b" stroke-width="1"/>

    <!-- lead_id -->
    <text x="16" y="108" font-size="12" font-family="monospace" font-weight="600" fill="#60a5fa">lead_id</text>
    <text x="136" y="108" font-size="11" font-family="monospace" fill="#94a3b8">UUID</text>
    <rect x="266" y="95" width="48" height="18" rx="3" fill="#3b82f6" fill-opacity="0.2"/>
    <text x="290" y="108" font-size="10" font-weight="700" fill="#60a5fa" text-anchor="middle">FK</text>

    <!-- title -->
    <text x="16" y="136" font-size="12" font-family="monospace" fill="#cbd5e1">title</text>
    <text x="136" y="136" font-size="11" font-family="monospace" fill="#64748b">VARCHAR(255)</text>
    <text x="300" y="136" font-size="11" fill="#ef4444" text-anchor="end">*</text>

    <!-- value_rm -->
    <text x="16" y="164" font-size="12" font-family="monospace" font-weight="600" fill="#fbbf24">value_rm</text>
    <text x="136" y="164" font-size="11" font-family="monospace" fill="#f59e0b">DECIMAL(12,2)</text>
    <rect x="256" y="151" width="58" height="18" rx="3" fill="#f59e0b" fill-opacity="0.15"/>
    <text x="285" y="164" font-size="9" font-weight="600" fill="#f59e0b" text-anchor="middle">RM / MYR</text>

    <!-- stage -->
    <text x="16" y="192" font-size="12" font-family="monospace" fill="#cbd5e1">stage</text>
    <text x="136" y="192" font-size="11" font-family="monospace" fill="#64748b">VARCHAR(50)</text>
    <rect x="246" y="179" width="68" height="18" rx="3" fill="#8b5cf6" fill-opacity="0.15"/>
    <text x="280" y="192" font-size="9" font-weight="600" fill="#a78bfa" text-anchor="middle">5 Kanban</text>

    <!-- created_at -->
    <text x="16" y="220" font-size="12" font-family="monospace" fill="#94a3b8">created_at</text>
    <text x="136" y="220" font-size="11" font-family="monospace" fill="#64748b">TIMESTAMPTZ</text>

    <!-- updated_at -->
    <text x="16" y="248" font-size="12" font-family="monospace" fill="#94a3b8">updated_at</text>
    <text x="136" y="248" font-size="11" font-family="monospace" fill="#64748b">TIMESTAMPTZ</text>

    <!-- cascade note -->
    <rect x="16" y="266" width="298" height="24" rx="4" fill="#1e293b" fill-opacity="0.5"/>
    <text x="26" y="282" font-size="10" fill="#64748b">⚡ ON DELETE CASCADE (linked to lead)</text>
  </g>

  <!-- ==================== TABLE 3: ACTIVITIES ==================== -->
  <g transform="translate(60, 470)" filter="url(#cardShadow)">
    <!-- Header -->
    <rect x="0" y="0" width="320" height="48" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="38" width="320" height="10" fill="#1e293b"/>
    <rect x="14" y="14" width="8" height="20" rx="2" fill="url(#purpleGrad)"/>
    <text x="32" y="29" font-size="15" font-weight="700" fill="#f1f5f9">activities</text>
    <rect x="216" y="14" width="90" height="20" rx="4" fill="#8b5cf6" fill-opacity="0.15"/>
    <text x="261" y="28" font-size="11" font-weight="600" fill="#a78bfa" text-anchor="middle">Audit &amp; Logs</text>

    <!-- Body -->
    <rect x="0" y="48" width="320" height="240" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="48" width="320" height="10" fill="#0f172a"/>

    <!-- Columns -->
    <!-- id -->
    <text x="16" y="76" font-size="12" font-family="monospace" font-weight="600" fill="#f8fafc">id</text>
    <text x="140" y="76" font-size="11" font-family="monospace" fill="#94a3b8">UUID</text>
    <rect x="256" y="63" width="48" height="18" rx="3" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="280" y="76" font-size="10" font-weight="700" fill="#fbbf24" text-anchor="middle">PK</text>
    <line x1="16" y1="89" x2="304" y2="89" stroke="#1e293b" stroke-width="1"/>

    <!-- lead_id -->
    <text x="16" y="108" font-size="12" font-family="monospace" font-weight="600" fill="#60a5fa">lead_id</text>
    <text x="140" y="108" font-size="11" font-family="monospace" fill="#94a3b8">UUID (null)</text>
    <rect x="256" y="95" width="48" height="18" rx="3" fill="#3b82f6" fill-opacity="0.2"/>
    <text x="280" y="108" font-size="10" font-weight="700" fill="#60a5fa" text-anchor="middle">FK</text>

    <!-- opportunity_id -->
    <text x="16" y="136" font-size="12" font-family="monospace" font-weight="600" fill="#fbbf24">opportunity_id</text>
    <text x="140" y="136" font-size="11" font-family="monospace" fill="#94a3b8">UUID (null)</text>
    <rect x="256" y="123" width="48" height="18" rx="3" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="280" y="136" font-size="10" font-weight="700" fill="#fbbf24" text-anchor="middle">FK</text>

    <!-- type -->
    <text x="16" y="164" font-size="12" font-family="monospace" fill="#cbd5e1">type</text>
    <text x="140" y="164" font-size="11" font-family="monospace" fill="#64748b">VARCHAR(50)</text>
    <text x="290" y="164" font-size="10" fill="#94a3b8" text-anchor="end">Call|Email|Meet|Note</text>

    <!-- date -->
    <text x="16" y="192" font-size="12" font-family="monospace" fill="#cbd5e1">date</text>
    <text x="140" y="192" font-size="11" font-family="monospace" fill="#64748b">TIMESTAMPTZ</text>

    <!-- description -->
    <text x="16" y="220" font-size="12" font-family="monospace" fill="#cbd5e1">description</text>
    <text x="140" y="220" font-size="11" font-family="monospace" fill="#64748b">TEXT</text>
    <text x="290" y="220" font-size="11" fill="#ef4444" text-anchor="end">*</text>

    <!-- created_at -->
    <text x="16" y="248" font-size="12" font-family="monospace" fill="#94a3b8">created_at</text>
    <text x="140" y="248" font-size="11" font-family="monospace" fill="#64748b">TIMESTAMPTZ</text>

    <!-- option B note -->
    <rect x="16" y="262" width="288" height="20" rx="3" fill="#8b5cf6" fill-opacity="0.1"/>
    <text x="26" y="276" font-size="10" fill="#a78bfa">✨ Auto-populated by Option B Extractor</text>
  </g>

  <!-- ==================== TABLE 4: TAX_DOCUMENT_CHUNKS ==================== -->
  <g transform="translate(460, 470)" filter="url(#cardShadow)">
    <!-- Header -->
    <rect x="0" y="0" width="680" height="48" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="38" width="680" height="10" fill="#1e293b"/>
    <rect x="14" y="14" width="8" height="20" rx="2" fill="url(#emeraldGrad)"/>
    <text x="32" y="29" font-size="15" font-weight="700" fill="#f1f5f9">tax_document_chunks</text>
    <rect x="520" y="14" width="146" height="20" rx="4" fill="#10b981" fill-opacity="0.15"/>
    <text x="593" y="28" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">RAG Knowledge Base</text>

    <!-- Body -->
    <rect x="0" y="48" width="680" height="240" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="48" width="680" height="10" fill="#0f172a"/>

    <!-- Left Column Set -->
    <text x="16" y="76" font-size="12" font-family="monospace" font-weight="600" fill="#f8fafc">id</text>
    <text x="140" y="76" font-size="11" font-family="monospace" fill="#94a3b8">UUID</text>
    <rect x="236" y="63" width="48" height="18" rx="3" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="260" y="76" font-size="10" font-weight="700" fill="#fbbf24" text-anchor="middle">PK</text>
    <line x1="16" y1="89" x2="310" y2="89" stroke="#1e293b" stroke-width="1"/>

    <text x="16" y="108" font-size="12" font-family="monospace" fill="#cbd5e1">doc_name</text>
    <text x="140" y="108" font-size="11" font-family="monospace" fill="#64748b">VARCHAR(255)</text>
    <text x="290" y="108" font-size="11" fill="#ef4444" text-anchor="end">*</text>

    <text x="16" y="136" font-size="12" font-family="monospace" fill="#cbd5e1">page_number</text>
    <text x="140" y="136" font-size="11" font-family="monospace" fill="#64748b">INTEGER</text>
    <text x="290" y="136" font-size="11" fill="#ef4444" text-anchor="end">*</text>

    <text x="16" y="164" font-size="12" font-family="monospace" fill="#cbd5e1">section_title</text>
    <text x="140" y="164" font-size="11" font-family="monospace" fill="#64748b">VARCHAR(255)</text>

    <text x="16" y="192" font-size="12" font-family="monospace" fill="#cbd5e1">chunk_content</text>
    <text x="140" y="192" font-size="11" font-family="monospace" fill="#64748b">TEXT</text>
    <text x="290" y="192" font-size="11" fill="#ef4444" text-anchor="end">*</text>

    <text x="16" y="220" font-size="12" font-family="monospace" fill="#94a3b8">metadata</text>
    <text x="140" y="220" font-size="11" font-family="monospace" fill="#64748b">JSONB</text>

    <text x="16" y="248" font-size="12" font-family="monospace" fill="#94a3b8">created_at</text>
    <text x="140" y="248" font-size="11" font-family="monospace" fill="#64748b">TIMESTAMPTZ</text>

    <!-- Vertical separator -->
    <line x1="330" y1="60" x2="330" y2="270" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Right Column: Vector & Indexing Features -->
    <g transform="translate(350, 65)">
      <rect x="0" y="0" width="310" height="90" rx="8" fill="#132338" stroke="#1e3a5f" stroke-width="1"/>
      <circle cx="16" cy="18" r="5" fill="#34d399"/>
      <text x="28" y="22" font-size="12" font-weight="700" fill="#6ee7b7">embedding VECTOR(768)</text>
      <text x="16" y="44" font-size="11" fill="#94a3b8">• 768-dimensional float embedding vector</text>
      <text x="16" y="60" font-size="11" fill="#94a3b8">• Generated via Google Gemini API</text>
      <text x="16" y="76" font-size="11" fill="#94a3b8">• Matches top-k cosine similarity queries</text>

      <!-- HNSW Index Box -->
      <rect x="0" y="102" width="310" height="98" rx="8" fill="#1e1b4b" stroke="#312e81" stroke-width="1"/>
      <circle cx="16" cy="120" r="5" fill="#a78bfa"/>
      <text x="28" y="124" font-size="12" font-weight="700" fill="#c4b5fd">HNSW Index (Hierarchical Navigable Small World)</text>
      <text x="16" y="146" font-size="11" font-family="monospace" fill="#a5b4fc">USING hnsw (embedding vector_cosine_ops)</text>
      <text x="16" y="164" font-size="11" fill="#94a3b8">• Sub-millisecond ANN search (m=16, ef=64)</text>
      <text x="16" y="182" font-size="11" fill="#94a3b8">• Function: match_tax_chunks(embedding, threshold)</text>
    </g>
  </g>

  <!-- ==================== RELATIONSHIP CONNECTORS ==================== -->
  <!-- Relationship 1: LEADS (1) to OPPORTUNITIES (N) -->
  <path d="M 380 180 L 460 180" fill="none" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="396" y="166" width="48" height="18" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <text x="420" y="179" font-size="10" font-weight="700" fill="#60a5fa" text-anchor="middle">1 : N</text>

  <!-- Relationship 2: LEADS (1) to ACTIVITIES (N) -->
  <path d="M 220 382 L 220 470" fill="none" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="196" y="416" width="48" height="18" rx="4" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
  <text x="220" y="429" font-size="10" font-weight="700" fill="#c4b5fd" text-anchor="middle">1 : N</text>

  <!-- Relationship 3: OPPORTUNITIES (1) to ACTIVITIES (N) -->
  <path d="M 500 382 L 500 426 L 310 426 L 310 470" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <rect x="380" y="416" width="58" height="18" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="409" y="429" font-size="9" font-weight="700" fill="#fbbf24" text-anchor="middle">1 : N (null)</text>

  <!-- Legend / Info footer -->
  <g transform="translate(830, 150)">
    <rect x="0" y="0" width="310" height="180" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="16" y="26" font-size="13" font-weight="700" fill="#f1f5f9">Architectural Highlights</text>
    
    <circle cx="24" cy="54" r="4" fill="#3b82f6"/>
    <text x="36" y="58" font-size="11" fill="#cbd5e1">Strict Referential Integrity (CASCADE / NULL)</text>

    <circle cx="24" cy="80" r="4" fill="#f59e0b"/>
    <text x="36" y="84" font-size="11" fill="#cbd5e1">Currency tracked strictly in RM (DECIMAL)</text>

    <circle cx="24" cy="106" r="4" fill="#10b981"/>
    <text x="36" y="110" font-size="11" fill="#cbd5e1">pgvector HNSW for &lt;5ms vector matching</text>

    <circle cx="24" cy="132" r="4" fill="#8b5cf6"/>
    <text x="36" y="136" font-size="11" fill="#cbd5e1">Audited interactions &amp; AI note extraction</text>

    <rect x="16" y="150" width="278" height="20" rx="4" fill="#1e293b"/>
    <text x="155" y="164" font-size="10" font-family="monospace" fill="#94a3b8" text-anchor="middle">schema.sql • Supabase PostgreSQL</text>
  </g>
</svg>
